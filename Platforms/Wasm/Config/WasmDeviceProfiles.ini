[Wasm_Desktop DeviceProfile]
+CVars=r.Shadow.MaxCSMResolution=1024

[Wasm_IOS DeviceProfile]
; WebKit can discard all geometry tested against read-only depth. The Wasm RHI
; can keep that attachment writable and sample its separate read-only copy.
+CVars=r.WebGPU.WritableDepth=1
; WebKit render bundles can drop opaque draws and their shadows (UE-411296).
+CVars=r.WebGPU.RenderBundles=0
